<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>وين؟ — تكسي يبرود</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;color:#111;background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#000;color:#fff;padding:14px 17px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500}.logo{font-size:28px;font-weight:800}.main,.auth{max-width:680px;margin:auto;padding:16px;padding-bottom:40px}.auth{max-width:440px;margin:20px auto}.brand{background:#000;color:#fff;text-align:center;font-size:60px;font-weight:800;border-radius:20px;padding:20px}.sub,.muted{color:#777}.sub{text-align:center}label{display:block;margin:12px 0;font-weight:700;font-size:14px}input,select,textarea{display:block;width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-top:6px;background:#fff}textarea{resize:vertical}.btn{background:#000;color:#fff;border:0;border-radius:13px;padding:13px;font-weight:800}.full{width:100%}.light{background:white;color:#000;border:1px solid #111}.danger{background:#fff;color:#922;border:1px solid #d9baba}.card{border:1px solid #e5e5e5;border-radius:16px;padding:15px;margin:12px 0}.note{background:#f4f4f4;padding:13px;border-radius:12px;line-height:1.6}.tabs,.row,.two{display:flex;gap:8px}.tabs{margin:14px 0;overflow:auto}.tab,.car{flex:1;padding:10px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:700}.on,.selected{background:#eee;border-color:#000}.row{justify-content:space-between;align-items:center}.two{flex-wrap:wrap}.car{min-width:40%}.map{height:310px;border-radius:15px;margin:12px 0;overflow:hidden;border:1px solid #ddd}.pill{background:#eee;padding:4px 10px;border-radius:50px;font-size:12px}.black{background:#000;color:#fff}.hero{font-size:24px;font-weight:800;margin:8px 0}.center{text-align:center;padding:30px;color:#777}.line{height:1px;background:#eee;margin:14px 0}.message{max-width:84%;padding:10px 12px;border-radius:14px;margin:8px 0;line-height:1.5;overflow-wrap:anywhere}.mine{background:#000;color:#fff;margin-right:auto}.theirs{background:#eee;color:#111;margin-left:auto}.chat-list{min-height:180px;max-height:55vh;overflow:auto;padding:10px;background:#fafafa;border-radius:14px}.small{font-size:12px;color:#777}.chat-form{display:flex;gap:8px;margin-top:10px}.chat-form input{margin:0}.chat-form button{min-width:72px}.ride{cursor:pointer}.ride.active{border:2px solid #000}.admin-stat{background:#f4f4f4;border-radius:12px;padding:14px}.admin-stat b{display:block;font-size:24px}#toast{position:fixed;bottom:20px;left:5%;width:90%;max-width:520px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px;border-radius:12px;opacity:0;z-index:2000;text-align:center;pointer-events:none}#toast.show{opacity:1}a{color:inherit}
</style></head>
<body><div id="app" class="center">جارٍ تشغيل وين؟…</div><div id="toast"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const C=window.WEIN_CONFIG||{},app=document.querySelector('#app');
let db,user,profile,mode='login',newRole='customer',map,pick=null,drop=null,pickMarker,dropMarker,vehicle='economy',adminTab='users',chatRide=null,chatChannel=null,poll;
const roleNames={customer:'زبون',driver:'سائق',office:'مكتب تكسي',admin:'مدير النظام'};
const statusNames={searching:'نبحث عن سيارة',accepted:'تم قبول الطلب',on_the_way:'السائق في الطريق',arrived:'وصل السائق',started:'الرحلة جارية',completed:'اكتملت الرحلة',cancelled:'ملغاة',no_driver:'لا يوجد سائق متاح'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3500)}
function shell(content){clearTimeout(poll);if(map){map.remove();map=null}app.innerHTML='<header class="top"><div><div class="logo">وين؟</div><small>تكسي يبرود</small></div><button class="tab" data-a="logout">تسجيل الخروج</button></header><main class="main">'+content+'</main>'}
function auth(msg=''){app.innerHTML='<main class="auth"><div class="brand">وين؟</div><p class="sub">خدمة حجز التكسي في يبرود</p><div class="tabs"><button class="tab '+(mode==='login'?'on':'')+'" data-a="mode" data-v="login">تسجيل الدخول</button><button class="tab '+(mode==='signup'?'on':'')+'" data-a="mode" data-v="signup">إنشاء حساب</button></div><form id="authForm">'+(mode==='signup'?'<label>الاسم الكامل<input name="full_name" required></label><label>رقم الهاتف<input name="phone" type="tel" required dir="ltr"></label><label>نوع الحساب<select name="role" id="roleSelect"><option value="customer">زبون — طلب سيارة</option><option value="driver">سائق — استقبال طلبات</option><option value="office">مكتب تكسي — إدارة الطلبات</option></select></label>':'')+'<label>البريد الإلكتروني<input name="email" type="email" required dir="ltr" autocomplete="email"></label><label>كلمة المرور<input name="password" type="password" required minlength="6" dir="ltr"></label><button class="btn full">'+(mode==='login'?'دخول':'إنشاء الحساب')+'</button></form>'+(msg?'<div class="note" style="margin-top:12px">'+esc(msg)+'</div>':'')+'<button class="tab full" style="margin-top:10px" data-a="forgot">نسيت كلمة المرور؟</button><p class="muted">السائق والمكتب يحتاجان موافقة الإدارة قبل استقبال الطلبات.</p></main>'}
document.addEventListener('submit',async e=>{if(e.target.id==='authForm'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(mode==='signup'){let {data,error}=await db.auth.signUp({email:d.email,password:d.password,options:{data:{full_name:d.full_name,phone:d.phone,role:d.role}}});if(error)throw error;if(!data.session)return auth('تم إنشاء الحساب. أكّد البريد الإلكتروني ثم سجّل الدخول.')}else{let {error}=await db.auth.signInWithPassword({email:d.email,password:d.password});if(error)throw error}}catch(x){auth('تعذّر إكمال العملية: '+x.message)}}
if(e.target.id==='chatForm'){e.preventDefault();if(!chatRide)return;let field=e.target.elements.message,body=field.value.trim();if(!body)return;field.disabled=true;let {error}=await db.from('ride_messages').insert({ride_id:Number(chatRide.id),sender_id:user.id,body});field.disabled=false;if(error)return toast('لم تُرسل الرسالة: '+error.message);field.value='';await loadMessages(chatRide.id,true)}});
async function route(s){clearTimeout(poll);if(!s){user=null;profile=null;return auth()}user=s.user;let {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return shell('<div class="note">تعذّر تحميل الحساب: '+esc(error.message)+'</div>');if(!data)return shell('<div class="note">ملف الحساب غير موجود في profiles. تحقق من إعداد قاعدة البيانات.</div>');profile=data;
if(profile.status!=='active')return shell('<div class="card"><h2>الحساب قيد المراجعة</h2><p>حالة الحساب: '+esc(profile.status)+'</p><button class="btn light full" data-a="refresh">تحديث الحالة</button></div>');
if(profile.role==='admin'&&user.email?.toLowerCase()==='uirafek762@gmail.com')return admin();if(profile.role==='admin')return shell('<div class="note">هذا الحساب مسجل كمدير لكن البريد لا يطابق بريد المدير المخصص. راجع صلاحيات قاعدة البيانات.</div>');if(profile.role==='customer')return customer();return provider()}
function initMap(){if(!window.L)return toast('الخريطة تحتاج اتصالاً بالإنترنت');map=L.map('map').setView(pick||[33.9675,36.6575],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(pick)pickMarker=L.marker(pick,{draggable:true}).addTo(map).bindPopup('الانطلاق');if(drop)dropMarker=L.marker(drop,{draggable:true}).addTo(map).bindPopup('الوجهة');if(pickMarker)pickMarker.on('dragend',e=>pick=[e.target.getLatLng().lat,e.target.getLatLng().lng]);if(dropMarker)dropMarker.on('dragend',e=>drop=[e.target.getLatLng().lat,e.target.getLatLng().lng]);map.on('click',e=>{let p=[e.latlng.lat,e.latlng.lng];if(!pick){pick=p;pickMarker=L.marker(p,{draggable:true}).addTo(map).bindPopup('الانطلاق');pickMarker.on('dragend',e=>pick=[e.target.getLatLng().lat,e.target.getLatLng().lng]);toast('تم تحديد الانطلاق؛ اضغط لتحديد الوجهة')}else if(!drop){drop=p;dropMarker=L.marker(p,{draggable:true}).addTo(map).bindPopup('الوجهة');dropMarker.on('dragend',e=>drop=[e.target.getLatLng().lat,e.target.getLatLng().lng]);toast('تم تحديد الوجهة')}else{drop=p;dropMarker.setLatLng(p)}});setTimeout(()=>map.invalidateSize(),200)}
async function customer(){let {data,error}=await db.from('rides').select('*').eq('customer_id',user.id).order('created_at',{ascending:false}).limit(1);if(error)return shell('<div class="note">تعذّر تحميل الرحلة: '+esc(error.message)+'</div>');let r=data?.[0];if(r&&['searching','accepted','on_the_way','arrived','started'].includes(r.status)){shell('<div class="hero">رحلتك الحالية</div><div class="card"><span class="pill black">'+esc(statusNames[r.status]||r.status)+'</span><p><b>من:</b> '+esc(r.pickup)+'</p><p><b>إلى:</b> '+esc(r.dropoff)+'</p><p class="small">رقم الطلب: '+esc(r.id)+'</p>'+(r.status==='searching'?'<p>أرسلنا طلبك إلى السائقين والمكاتب المتاحين.</p>':'<p>يمكنك التواصل مع الجهة التي قبلت الرحلة.</p>')+'<button class="btn full" data-a="chat" data-id="'+r.id+'">فتح المحادثة مع السائق/المكتب</button>'+(r.status==='searching'||r.status==='accepted'?'<button class="btn danger full" style="margin-top:8px" data-a="cancel" data-id="'+r.id+'">إلغاء الطلب</button>':'')+'</div><button class="btn light full" data-a="history">سجل الرحلات</button>');poll=setTimeout(customer,7000);return}
pick=null;drop=null;shell('<div class="hero">أهلاً '+esc(profile.full_name||'بك')+' 👋</div><p class="muted">حدد الانطلاق والوجهة. سيصل الطلب لكل السائقين والمكاتب المتاحين.</p><label>مكان الانطلاق<input id="pickupText" placeholder="مثال: ساحة يبرود"></label><label>الوجهة<input id="dropText" placeholder="مثال: سوق يبرود القديم"></label><button class="btn light full" data-a="locate">استخدام موقعي الحالي</button><div id="map" class="map"></div><p class="small">انقر على الخريطة مرة لتحديد الانطلاق ومرة أخرى لتحديد الوجهة. اسحب العلامات لتعديل الموقع.</p><div class="two"><button class="car selected" data-a="vehicle" data-v="economy">🚕 سيارة اقتصادية</button><button class="car" data-a="vehicle" data-v="comfort">🚘 سيارة مريحة</button></div><p class="muted">السعر النهائي يحدده السائق أو المكتب عند تأكيد الرحلة.</p><button class="btn full" style="margin-top:10px" data-a="request">إرسال الطلب للجميع</button><button class="btn light full" style="margin-top:8px" data-a="history">سجل رحلاتي</button>');initMap()}
async function provider(){let {data:offers,error}=await db.from('ride_offers').select('ride_id,state').eq('recipient_id',user.id).eq('state','sent').order('created_at',{ascending:false}).limit(50);let ids=(offers||[]).map(x=>x.ride_id);let open=[];if(ids.length){let q=await db.from('rides').select('*').in('id',ids).eq('status','searching').order('created_at',{ascending:true});if(q.error)error=q.error;else open=q.data||[]}let {data:mine}=await db.from('rides').select('*').eq('accepted_by',user.id).order('created_at',{ascending:false}).limit(20);
shell('<div class="hero">'+esc(roleNames[profile.role])+'</div><p>'+esc(profile.full_name||'')+'</p><button class="btn light full" data-a="availability">'+(profile.available?'إيقاف استقبال الطلبات':'تفعيل التوفر')+'</button><div class="note" style="margin-top:10px">الطلبات تصل إلى حسابك عندما تكون حالتك متاحة وقت إنشاء الطلب.</div><h3>الطلبات المرسلة إليك</h3>'+(error?'<div class="note">'+esc(error.message)+'</div>':open.length?open.map(r=>'<div class="card"><span class="pill black">طلب جديد</span><p><b>من:</b> '+esc(r.pickup)+'</p><p><b>إلى:</b> '+esc(r.dropoff)+'</p><p class="small">الطلب رقم '+esc(r.id)+'</p><button class="btn full" data-a="accept" data-id="'+r.id+'">قبول الرحلة</button></div>').join(''):'<div class="center">لا توجد طلبات مرسلة حالياً</div>')+'<h3>الرحلات المقبولة</h3>'+((mine||[]).map(r=>'<div class="card"><span class="pill">'+esc(statusNames[r.status]||r.status)+'</span><p>'+esc(r.pickup)+' ← '+esc(r.dropoff)+'</p><button class="btn light full" data-a="chat" data-id="'+r.id+'">فتح محادثة الزبون</button>'+({accepted:['on_the_way','أنا في الطريق'],on_the_way:['arrived','وصلت'],arrived:['started','بدء الرحلة'],started:['completed','إنهاء الرحلة']}[r.status]?'<button class="btn full" style="margin-top:8px" data-a="status" data-id="'+r.id+'" data-v="'+({accepted:'on_the_way',on_the_way:'arrived',arrived:'started',started:'completed'}[r.status])+'">'+({accepted:'أنا في الطريق',on_the_way:'وصلت',arrived:'بدء الرحلة',started:'إنهاء الرحلة'}[r.status])+'</button>':'')+'</div>').join('')));poll=setTimeout(provider,7000)}
async function admin(){let {data:users,error}=await db.from('profiles').select('*').order('created_at',{ascending:false});let {data:rides}=await db.from('rides').select('*').order('created_at',{ascending:false}).limit(60);if(error)return shell('<div class="note">'+esc(error.message)+'</div>');let body=adminTab==='users'?(users||[]).filter(x=>x.role!=='admin').map(x=>'<div class="card"><div class="row"><b>'+esc(x.full_name)+'</b><span class="pill">'+esc(x.status)+'</span></div><p class="muted">'+esc(roleNames[x.role]||x.role)+' · '+esc(x.phone||'')+'</p><div class="row"><button class="btn" data-a="userStatus" data-id="'+x.id+'" data-v="active">تفعيل</button><button class="btn danger" data-a="userStatus" data-id="'+x.id+'" data-v="disabled">تعطيل</button></div></div>').join(''):'';
if(adminTab==='rides')body=(rides||[]).map(r=>'<div class="card"><span class="pill black">'+esc(statusNames[r.status]||r.status)+'</span><p>'+esc(r.pickup)+' ← '+esc(r.dropoff)+'</p><small>رقم الرحلة '+esc(r.id)+'</small></div>').join('');
if(adminTab==='settings')body='<div class="card"><h3>إدارة وين؟</h3><p>عدد الحسابات: '+users.length+'</p><p>الرحلات المعروضة: '+(rides||[]).length+'</p><p class="muted">تأكد من سياسات RLS في Supabase. لا تعتمد على الواجهة وحدها لحماية الإدارة.</p><p>الدعم: <a href="tel:0933712979">0933712979</a></p></div>';
shell('<div class="hero">لوحة تحكم الأدمن</div><p class="muted">'+esc(user.email)+'</p><div class="tabs"><button class="tab '+(adminTab==='users'?'on':'')+'" data-a="adminTab" data-v="users">الحسابات</button><button class="tab '+(adminTab==='rides'?'on':'')+'" data-a="adminTab" data-v="rides">الرحلات</button><button class="tab '+(adminTab==='settings'?'on':'')+'" data-a="adminTab" data-v="settings">النظام</button></div>'+body)}
async function history(){let {data,error}=await db.from('rides').select('*').eq('customer_id',user.id).order('created_at',{ascending:false}).limit(50);shell('<div class="hero">سجل الرحلات</div>'+(error?esc(error.message):(data||[]).map(r=>'<div class="card"><span class="pill">'+esc(statusNames[r.status]||r.status)+'</span><p>'+esc(r.pickup)+' ← '+esc(r.dropoff)+'</p><button class="btn light full" data-a="chat" data-id="'+r.id+'">المحادثة</button></div>').join(''))+'<button class="btn full" data-a="home">عودة</button>')}
async function openChat(id){let {data:ride,error}=await db.from('rides').select('*').eq('id',id).maybeSingle();if(error||!ride)return toast(error?.message||'الرحلة غير موجودة');if(ride.customer_id!==user.id&&ride.accepted_by!==user.id)return toast('المحادثة متاحة للزبون والسائق/المكتب الذي قبل الرحلة فقط');chatRide=ride;const other=ride.customer_id===user.id?'السائق/المكتب':'الزبون';shell('<div class="row"><div><div class="hero">محادثة الرحلة</div><div class="muted">الطلب #'+esc(ride.id)+' · '+esc(statusNames[ride.status]||ride.status)+'</div></div><button class="tab" data-a="back">رجوع</button></div><div class="note">من: '+esc(ride.pickup)+'<br>إلى: '+esc(ride.dropoff)+'</div><div id="chatMessages" class="chat-list"><div class="center">جارٍ تحميل الرسائل…</div></div><form id="chatForm" class="chat-form"><input name="message" maxlength="2000" placeholder="اكتب رسالة…" autocomplete="off" required><button class="btn">إرسال</button></form><p class="small">المحادثة خاصة بطرفي الرحلة. لا ترسل معلومات حساسة.</p>');await loadMessages(id,false);if(chatChannel)db.removeChannel(chatChannel);chatChannel=db.channel('ride-chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'ride_messages',filter:'ride_id=eq.'+id},()=>loadMessages(id,true)).subscribe();poll=setTimeout(()=>loadMessages(id,true),6000)}
async function loadMessages(id,keepBottom){let box=document.querySelector('#chatMessages');if(!box)return;let wasBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;let {data,error}=await db.from('ride_messages').select('id,ride_id,sender_id,body,created_at').eq('ride_id',Number(id)).order('created_at',{ascending:true}).limit(200);if(error){box.innerHTML='<div class="note">'+esc(error.message)+'</div>';return}box.innerHTML=(data||[]).map(m=>'<div class="message '+(m.sender_id===user.id?'mine':'theirs')+'">'+esc(m.body)+'<div class="small" style="color:inherit;opacity:.7;margin-top:4px">'+new Date(m.created_at).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+'</div></div>').join('')||'<div class="center">ابدأ المحادثة برسالة قصيرة.</div>';if(wasBottom||keepBottom)box.scrollTop=box.scrollHeight}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;try{
if(a==='mode'){mode=v;auth()}else if(a==='logout'){if(chatChannel)db.removeChannel(chatChannel);await db.auth.signOut()}else if(a==='forgot'){let email=document.querySelector('[name=email]')?.value;if(!email)return toast('اكتب البريد الإلكتروني أولاً');let {error}=await db.auth.resetPasswordForEmail(email);toast(error?error.message:'إذا كان البريد مسجلاً فسيصلك رابط الاستعادة')}
else if(a==='refresh')route((await db.auth.getSession()).data.session);else if(a==='locate'){if(!navigator.geolocation)return toast('تحديد الموقع غير مدعوم');navigator.geolocation.getCurrentPosition(p=>{pick=[p.coords.latitude,p.coords.longitude];if(map){if(pickMarker)pickMarker.setLatLng(pick);else pickMarker=L.marker(pick,{draggable:true}).addTo(map);map.setView(pick,16)}let t=document.querySelector('#pickupText');if(t)t.value='موقعي الحالي'},()=>toast('اسمح للمتصفح بتحديد الموقع أو حدد الموقع على الخريطة'),{enableHighAccuracy:true,timeout:12000})}
else if(a==='vehicle'){vehicle=v;document.querySelectorAll('[data-a=vehicle]').forEach(x=>x.classList.toggle('selected',x.dataset.v===v))}
else if(a==='request'){let p=document.querySelector('#pickupText').value.trim(),d=document.querySelector('#dropText').value.trim();if(!p||!d||!pick||!drop)return toast('اكتب العنوانين وحدد نقطتي الخريطة');b.disabled=true;let {data:rideId,error}=await db.rpc('create_ride_broadcast',{p_pickup:p,p_dropoff:d,p_pickup_lat:pick[0],p_pickup_lng:pick[1],p_dropoff_lat:drop[0],p_dropoff_lng:drop[1],p_vehicle_type:vehicle});if(error){b.disabled=false;return toast('تعذّر إرسال الطلب: '+error.message)}toast('تم إرسال الطلب للجهات المتاحة');customer()}
else if(a==='history')history();else if(a==='home')customer();else if(a==='cancel'){let {error}=await db.rpc('cancel_ride',{p_ride_id:Number(id)});toast(error?'تعذّر الإلغاء: '+error.message:'تم إلغاء الطلب');customer()}
else if(a==='availability'){let {error}=await db.from('profiles').update({available:!profile.available}).eq('id',user.id);if(error)return toast(error.message);profile.available=!profile.available;provider()}
else if(a==='accept'){b.disabled=true;let {data:won,error}=await db.rpc('accept_ride_broadcast',{p_ride_id:Number(id)});if(error)toast('تعذّر القبول: '+error.message);else toast(won?'تم قبول الرحلة':'سبقك طرف آخر إلى قبول الرحلة');provider()}
else if(a==='status'){let {error}=await db.rpc('update_ride_status',{p_ride_id:Number(id),p_status:v});toast(error?'تعذّر تحديث الحالة: '+error.message:'تم تحديث الحالة');provider()}
else if(a==='adminTab'){adminTab=v;admin()}else if(a==='userStatus'){let {error}=await db.from('profiles').update({status:v}).eq('id',id);toast(error?'تعذّر التحديث: '+error.message:'تم تحديث الحساب');admin()}
else if(a==='chat')openChat(Number(id));else if(a==='back'){if(chatChannel)db.removeChannel(chatChannel);chatChannel=null;chatRide=null;if(profile.role==='customer')customer();else provider()}
}catch(x){toast(x.message||'حدث خطأ غير معروف')}});
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY)auth('أضف إعدادات Supabase في config.js');else if(!window.supabase)auth('تعذّر تحميل Supabase؛ تحقق من الإنترنت');else{db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);db.auth.onAuthStateChange((event,s)=>{if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED'].includes(event))setTimeout(()=>route(s),0)})}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
