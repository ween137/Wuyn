
name: Delete old files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old files
        working-directory: repo
        run: |
          for f in \
            "app.js" "app2.js" "app3.js" "App.js" \
            "app (1).js" "auth.js" "Auth.js" \
            "signin.js" "signin (1).js" "signin (2).js" \
            "Signin.js" "admin.js" "icons (1).js" \
            "sw (1).js" "sw (2).js" \
            "app (1).css" "app .css" "app (3).css" \
            "check.html" "kyc.js" "netlify.toml"; do
            if [ -f "$f" ]; then
              git rm -f -- "$f"
            fi
          done

          if [ -d _legacy_archive ]; then
            git rm -r -f _legacy_archive
          fi

      - name: Commit and push
        working-directory: repo
        run: |
          git config user.name "cleanup-bot"
          git config user.email "cleanup-bot@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No files to delete"
          else
            git commit -m "Delete old files"
            git push origin HEAD:main
          fi
